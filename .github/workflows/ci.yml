name: ci 

on:
  push:
    branches: [ "grupo-2-parcial-2"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v4

        - uses: actions/setup-java@v4
          with: java-version: '17'
          
        - uses: actions/upload-artifact@v4
          with:
           name: jar
           path: target/*.jar

      
